<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Trang liên kết mạng xã hội cá nhân.">
<meta name="theme-color" content="#0d0b14">
<title>Bio Link</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Alex+Brush&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0b14;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-bg-soft: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.18);
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.72);
  --accent-1: #8b5cf6;
  --accent-2: #22d3ee;
  --radius-lg: 32px;
  --radius-md: 20px;
  --radius-sm: 18px;
  --glass-blur: 1px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Be Vietnam Pro', sans-serif;
  user-select: none;
}

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background-color: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text);
  padding: 20px;
  padding-bottom: 110px;
  overflow-x: hidden;
  position: relative;
}

.desktop-only { display: none; }

@keyframes drift1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(6vw, 8vh) scale(1.15); }
}
@keyframes drift2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-5vw, -6vh) scale(1.1); }
}

.bg-video {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  object-fit: cover;
  z-index: -2;
  opacity: 0.85;
}

#particleCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: -1;
  pointer-events: none;
}

#enterOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(10, 8, 18, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  z-index: 9999;
  cursor: pointer;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#enterOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.enter-text {
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--text);
  text-transform: uppercase;
  animation: pulseText 2s infinite ease-in-out;
  text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
}
.click-text {
  font-family: 'Orbitron', monospace;
  font-size: 2rem;
  font-weight: 400;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.15em;
  animation: clickPulse 2s ease-in-out infinite;
}
.click-hint {
  font-size: 0.85rem;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  font-family: 'Fira Code', monospace;
}
@keyframes clickPulse {
  0%, 100% { opacity: 0.9; }
  50% { opacity: 0.3; }
}
@keyframes pulseText {
  0%, 100% { opacity: 0.35; transform: scale(0.98); }
  50% { opacity: 1; transform: scale(1.02); }
}

#loadingOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#loadingOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#constellationCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
.loading-box {
  position: relative;
  z-index: 1;
  width: 82%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 26px;
  padding: 0 6px;
}
.cube-wrap {
  width: 68px;
  height: 68px;
  margin: 6px auto 2px;
  perspective: 600px;
}
.cube {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: cubeSpin 5s linear infinite;
}
.cube .face {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.04);
  box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.25);
}
.cube .face:nth-child(1) { transform: rotateY(0deg) translateZ(34px); }
.cube .face:nth-child(2) { transform: rotateY(180deg) translateZ(34px); }
.cube .face:nth-child(3) { transform: rotateY(90deg) translateZ(34px); }
.cube .face:nth-child(4) { transform: rotateY(-90deg) translateZ(34px); }
.cube .face:nth-child(5) { transform: rotateX(90deg) translateZ(34px); }
.cube .face:nth-child(6) { transform: rotateX(-90deg) translateZ(34px); }
@keyframes cubeSpin {
  from { transform: rotateX(0deg) rotateY(0deg); }
  to { transform: rotateX(360deg) rotateY(360deg); }
}
.loading-percent {
  font-family: 'Orbitron', monospace;
  font-size: 1.15rem;
  font-weight: 400;
  letter-spacing: 4px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  text-align: center;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  margin-top: 10px;
}
.loading-welcome {
  font-family: 'Orbitron', monospace;
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-align: center;
  margin-top: 8px;
}

.bio-container {
  width: 100%;
  max-width: 440px;
  background: transparent;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-lg);
  padding: 36px 22px 24px;
  text-align: center;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
  position: relative;
  z-index: 1;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 0.15s ease-out, box-shadow 0.3s ease;
}

.datetime-widget {
  width: 100%;
  max-width: 440px;
  margin: 0 auto 18px;
  text-align: center;
}
.datetime-day {
  font-family: 'Alex Brush', cursive;
  font-size: 3rem;
  line-height: 1;
  color: var(--text);
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  margin-bottom: 6px;
}
.datetime-date {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
}
.datetime-time {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--text);
  margin-top: 2px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
}
.datetime-divider {
  width: 70%;
  max-width: 220px;
  margin: 12px auto 0;
  border: none;
  border-top: 1px dashed rgba(255, 255, 255, 0.4);
}

.page-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.avatar-box {
  position: relative;
  width: 100px;
  height: 100px;
  margin: 0 auto 16px;
}
.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 1;
  background: #1a1622;
}
.avatar-decoration {
  position: absolute;
  top: -12%; left: -12%;
  width: 124%; height: 124%;
  pointer-events: none;
  z-index: 2;
}
.status-dot {
  position: absolute;
  bottom: 2px; right: 2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 3px solid #1a1622;
  background: #80848e;
  z-index: 3;
  transition: background 0.3s ease;
}
.status-dot.online { background: #23a55a; }
.status-dot.idle { background: #f0b232; }
.status-dot.dnd { background: #f23f43; }
.status-dot.offline { background: #80848e; }

.activity-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  margin-bottom: 14px;
  max-width: 100%;
}
.activity-badge span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.display-name {
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}
.bio-text {
  color: rgba(255, 255, 255, 0.95);
  font-size: 0.98rem;
  font-weight: 500;
  margin-bottom: 8px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}
.zzz-icon {
  display: inline-block;
  filter: sepia(1) saturate(8) hue-rotate(5deg) brightness(1.2) drop-shadow(0 0 8px rgba(245, 158, 11, 0.7));
  margin: 0 4px;
  vertical-align: middle;
  transform: translateY(-2px);
  transition: transform 0.3s ease, filter 0.3s ease;
}
.zzz-icon:hover {
  transform: translateY(-2px) scale(1.2) rotate(6deg);
  filter: sepia(1) saturate(10) hue-rotate(10deg) brightness(1.35) drop-shadow(0 0 12px rgba(251, 191, 36, 0.9));
}
.location-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: rgba(255, 255, 255, 0.85);
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 24px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.links-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}
.link-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: var(--radius-sm);
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.25s ease;
}
.link-card:hover, .link-card:focus-visible {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.32);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
  outline: none;
}
.link-card:focus-visible {
  border-color: var(--accent-2);
}
.link-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.link-left i {
  font-size: 1.35rem;
  width: 22px;
  text-align: center;
}
.facebook .link-left i, .facebook .action-icon { color: #1877f2; }
.discord .link-left i, .discord .action-icon { color: #5865f2; }
.tiktok .link-left i, .tiktok .action-icon { color: #f00c54d8; }
.github .link-left i, .github .action-icon { color: #ffffff; }

.action-icon {
  font-size: 0.9rem;
  opacity: 0.85;
  transition: transform 0.2s ease;
}
.link-card:hover .action-icon {
  transform: translate(2px, -2px);
  opacity: 1;
}

.views-tag {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  text-align: left;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

.music-player-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 450px;
  background: transparent;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
  z-index: 100;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 0.15s ease-out;
}
.song-video-media {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: contain;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
  padding: 3px;
}

.player-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: hidden;
  text-align: left;
}
.song-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
}
.song-title {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.equalizer {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
  flex-shrink: 0;
}
.equalizer span {
  width: 3px;
  background: #ffffff;
  border-radius: 2px;
  height: 4px;
  animation: eqBounce 0.9s ease-in-out infinite;
  animation-play-state: paused;
}
.music-player-bar.playing .equalizer span { animation-play-state: running; }
.equalizer span:nth-child(1) { animation-duration: 0.7s; }
.equalizer span:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.15s; }
.equalizer span:nth-child(3) { animation-duration: 0.8s; animation-delay: 0.3s; }
.equalizer span:nth-child(4) { animation-duration: 1s; animation-delay: 0.1s; }
@keyframes eqBounce { 0%, 100% { height: 3px; } 50% { height: 12px; } }

.timeline-box {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.75);
}
.progress-bar-bg {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  border-radius: 4px;
  transition: width 0.1s linear;
}
.player-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  color: rgba(255, 255, 255, 0.9);
  font-size: 1.1rem;
}
.player-controls i {
  cursor: pointer;
  transition: transform 0.15s ease, color 0.15s ease;
}
.player-controls i:hover { transform: scale(1.18); color: #ecf0f1; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 10px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.45);
  background-clip: padding-box;
}
html { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) rgba(255, 255, 255, 0.05); }

@media (max-width: 480px) {
  .bio-container { padding: 30px 16px 20px; border-radius: 26px; }
  .avatar-box { width: 84px; height: 84px; }
  .display-name { font-size: 1.4rem; }
  .datetime-day { font-size: 2.3rem; }
  .music-player-bar { padding: 8px 12px; gap: 10px; }
  .song-video-media { width: 40px; height: 40px; }
  .click-text { font-size: 1.6rem; }
}

/* ===================== DESKTOP (>= 768px) ===================== */
@media (min-width: 768px) {
  .mobile-only { display: none !important; }
  .desktop-only { display: block; }

  body {
    background: #0a0a0a;
    align-items: flex-start;
    padding: 0;
  }

  #enterOverlay {
    background: rgba(0,0,0,0.65);
  }

  #loadingOverlay { background: #000000; gap: 2rem; }

  .datetime-widget.datetime-desktop {
    position: absolute;
    top: 0.3rem; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 100;
    width: max-content;
    max-width: 90vw;
  }
  .datetime-desktop .datetime-day {
    font-size: 4.5rem;
    margin-bottom: 10px;
  }
  .datetime-desktop .datetime-date {
    font-size: 1rem;
    letter-spacing: 5px;
  }
  .datetime-desktop .datetime-time {
    font-size: 2.2rem;
    letter-spacing: 8px;
  }
  .datetime-desktop .datetime-divider {
    width: 90%;
    max-width: 320px;
    margin-top: 16px;
  }

  .cosmic-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    padding-bottom: 140px;
    position: relative;
    z-index: 1;
  }

  .hero-matrix {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10.5rem;
    margin-bottom: 3rem;
    gap: 4.5rem;
    perspective: 1000px;
  }

  .avatar-constellation {
    position: relative;
    animation: avatarFloat 4s ease-in-out infinite;
  }
  .avatar-rings {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  .ring {
    position: absolute;
    border: 1px solid transparent;
    border-radius: 50%;
    animation: ringRotate 10s linear infinite;
  }
  .ring:nth-child(1) { width: 210px; height: 210px; border-top-color: rgba(255,255,255,0.25); border-right-color: rgba(255,255,255,0.25); animation-duration: 8s; }
  .ring:nth-child(2) { width: 245px; height: 245px; border-bottom-color: rgba(255,255,255,0.15); border-left-color: rgba(255,255,255,0.15); animation-duration: 12s; animation-direction: reverse; }
  .ring:nth-child(3) { width: 280px; height: 280px; border-top-color: rgba(255,255,255,0.08); border-bottom-color: rgba(255,255,255,0.08); animation-duration: 15s; }
  @keyframes avatarFloat {
    0%, 100% { transform: translateY(0px) rotateZ(0deg); }
    50% { transform: translateY(-15px) rotateZ(2deg); }
  }
  @keyframes ringRotate {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .avatar-master {
    width: 170px; height: 170px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    padding: 4px;
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
    position: relative; z-index: 2;
    background: #121014;
  }
  .avatar-master img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .avatar-master .avatar-decoration-desk {
    position: absolute;
    top: -21px; left: -21px;
    width: calc(100% + 42px);
    height: calc(100% + 42px);
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    display: none;
  }

  .legend-info {
    text-align: center;
    max-width: 600px;
  }
  .legend-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.8rem; font-weight: 700;
    margin-bottom: 1rem;
    color: #ffffff;
    line-height: 1.2;
    white-space: nowrap;
  }
  .legend-subtitle {
    font-size: 1.8rem;
    color: rgba(255,255,255,0.9);
    margin-bottom: 1.5rem;
    font-weight: 700;
  }
  .social-cosmos {
    width: 100%;
    max-width: 800px;
    margin: 3rem 0;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    padding: 3rem 4rem;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255,255,255,0.03);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .social-cosmos:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 60px rgba(255,255,255,0.06);
  }
  .social-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .social-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: #ffffff;
  }
  .social-links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
  }
  .social-link-enhanced {
    display: flex;
    align-items: center;
    gap: 1.5rem;

(function () {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  const PARTICLE_COUNT = 34;
  function makeParticle() {
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.6,
      speedY: Math.random() * 0.5 + 0.2,
      speedX: (Math.random() - 0.5) * 0.3,
      opacity: Math.random() * 0.5 + 0.2
    };
  }
  const particles = Array.from({ length: PARTICLE_COUNT }, makeParticle);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function animateParticles() {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
      ctx.fill();
      if (!reduceMotion) {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > h + 5) { p.y = -5; p.x = Math.random() * w; }
        if (p.x > w + 5) p.x = -5;
        if (p.x < -5) p.x = w + 5;
      }
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
})();

(function () {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const bio = document.getElementById('bioContainer');
  const player = document.getElementById('musicPlayerBar');
  const social = document.getElementById('socialCosmos');
  const maxTilt = 5;
  function applyTilt(el, baseTransform) {
    return function (e) {
      const rect = el.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = (e.clientX - centerX) / (window.innerWidth / 2);
      const dy = (e.clientY - centerY) / (window.innerHeight / 2);
      const rotateY = dx * maxTilt;
      const rotateX = -dy * maxTilt;
      el.style.transform = `${baseTransform} perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    };
  }
  document.addEventListener('mousemove', (e) => {
    applyTilt(bio, '')(e);
    applyTilt(player, 'translateX(-50%)')(e);
    if (social) applyTilt(social, '')(e);
  });
  document.addEventListener('mouseleave', () => {
    bio.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
    player.style.transform = 'translateX(-50%) perspective(900px) rotateX(0deg) rotateY(0deg)';
    if (social) social.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
  });
})();

(function () {
  const canvas = document.getElementById('constellationCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COUNT = 70;
  const LINK_DIST = 130;
  const stars = Array.from({ length: COUNT }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.6 + 0.8,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    tw: Math.random() * Math.PI * 2
  }));
  function draw() {
    ctx.clearRect(0, 0, w, h);
    if (!reduceMotion) {
      for (const s of stars) {
        s.tw += 0.03;
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < -10) s.x = w + 10;
        if (s.x > w + 10) s.x = -10;
        if (s.y < -10) s.y = h + 10;
        if (s.y > h + 10) s.y = -10;
      }
    }
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          ctx.strokeStyle = `rgba(255,255,255,${(1 - dist / LINK_DIST) * 0.4})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(stars[i].x, stars[i].y);
          ctx.lineTo(stars[j].x, stars[j].y);
          ctx.stroke();
        }
      }
    }
    for (const s of stars) {
      const alpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

(function () {
  const loadingOverlay = document.getElementById('loadingOverlay');
  const enterOverlay = document.getElementById('enterOverlay');
  const percentEl = document.getElementById('loadingPercent');
  const bgVideo = document.getElementById('bgVideo');

  let fakeProgress = 0;
  let videoReady = false;
  let finished = false;

  function setBar(pct) {
    const clamped = Math.max(0, Math.min(100, pct));
    percentEl.textContent = Math.round(clamped) + '%';
  }

  const progressTimer = setInterval(() => {
    if (finished) return;
    const ceiling = videoReady ? 100 : 92;
    const step = videoReady ? 6 : Math.max(0.4, (ceiling - fakeProgress) * 0.08);
    fakeProgress = Math.min(ceiling, fakeProgress + step);
    setBar(fakeProgress);
    if (videoReady && fakeProgress >= 100) finishLoading();
  }, 90);

  function finishLoading() {
    if (finished) return;
    finished = true;
    clearInterval(progressTimer);
    setBar(100);
    const welcomeEl = document.querySelector('.loading-welcome');
    if (welcomeEl) welcomeEl.innerText = 'Ready...';
    setTimeout(() => {
      loadingOverlay.classList.add('hidden');
      enterOverlay.classList.remove('hidden');
    }, 350);
  }

  function markVideoReady() {
    videoReady = true;
  }

  if (bgVideo) {
    if (bgVideo.readyState >= 3) {
      markVideoReady();
    } else {
      bgVideo.addEventListener('canplaythrough', markVideoReady, { once: true });
      bgVideo.addEventListener('error', markVideoReady, { once: true });
    }
  } else {
    markVideoReady();
  }

  setTimeout(() => {
    videoReady = true;
  }, 6000);
})();

function initViewsCounter() {
  const viewsValueEl = document.getElementById('viewsValue');
  const deskViewsEl = document.getElementById('deskViews');
  const baseViews = 220;

  function setText(n) {
    if (viewsValueEl) viewsValueEl.innerText = n;
    if (deskViewsEl) deskViewsEl.innerText = n;
  }

  setText(baseViews);

  function animate(total) {
    let current = baseViews;
    const target = Math.max(baseViews, total);
    setText(current);
    if (target <= current) return;
    const timer = setInterval(() => {
      current += 1;
      if (current >= target) {
        current = target;
        clearInterval(timer);
      }
      setText(current);
    }, 40);
  }

  const alreadyCounted = sessionStorage.getItem('counted_this_session');
  const endpoint = alreadyCounted ? 'get' : 'hit';

  fetch(`https://abacus.jasoncameron.dev/${endpoint}/nvkn_bio/views`)
    .then(r => r.json())
    .then(data => {
      if (!alreadyCounted) sessionStorage.setItem('counted_this_session', '1');
      const apiValue = parseInt(data && data.value, 10) || 0;
      animate(baseViews + apiValue);
    })
    .catch(() => {
      const fallbackUrl = alreadyCounted
        ? 'https://countapi.mileshilliard.com/api/v1/get/bio_nvkn_views'
        : 'https://countapi.mileshilliard.com/api/v1/hit/bio_nvkn_views';
      fetch(fallbackUrl)
        .then(r => r.json())
        .then(data => {
          if (!alreadyCounted) sessionStorage.setItem('counted_this_session', '1');
          const apiValue = parseInt(data && data.value, 10) || 0;
          animate(baseViews + apiValue);
        })
        .catch(() => animate(baseViews));
    });
}

  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);

      const user = data.data.discord_user;
      if (user.avatar) {
        const ext = user.avatar.startsWith("a_") ? "gif" : "png";
        const url = `https://cdn.discordapp.com/avatars/${avatarUserId}/${user.avatar}.${ext}?size=256`;
        document.getElementById('userAvatar').src = url;
        if (deskAvatar) deskAvatar.src = url;
        if (deskStatusAvatar) deskStatusAvatar.src = url;
      }
      const status = data.data.discord_status || 'offline';
      if (user.avatar_decoration_data) {
        const decoHash = user.avatar_decoration_data.asset;
        const decoUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${decoHash}.png?size=240&passthrough=true`;
        const decoImg = document.getElementById('avatarDecoration');
        if (decoImg) {
          decoImg.src = decoUrl;
          decoImg.style.display = 'block';
        }
        const decoImgDesk = document.getElementById('avatarDecorationDesk');
        if (decoImgDesk) {
          decoImgDesk.src = decoUrl;
          decoImgDesk.style.display = 'block';
        }
      }
      document.getElementById('statusDot').className = 'status-dot ' + status;
      if (deskStatusName) deskStatusName.innerText = user.global_name || user.username || '@Nvkn.ily';
      if (deskStatusText) deskStatusText.innerText = statusMap[status] || statusMap.offline;
      const activities = (data.data.activities || []).filter(a => a.type !== 4);
      const activityBadge = document.getElementById('activityBadge');
      const activityIcon = document.getElementById('activityIcon');
      const activityText = document.getElementById('activityText');
      if (activities.length > 0) {
        const act = activities[0];
        const icons = { 0: '🎮︎', 1: '🔴', 2: '🎧︎ ', 3: '📺︎', 5: '🏆︎' };
        activityIcon.innerText = icons[act.type] || '✨︎';
        activityText.innerText = act.name;
        activityBadge.style.display = 'inline-flex';
      } else {
        activityBadge.style.display = 'none';
      }
    }
  } catch (err) {
    console.log("Không lấy được dữ liệu Discord");
  }
}

(function () {
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  const dtDayEls = document.querySelectorAll('.datetime-day');
  const dtDateEls = document.querySelectorAll('.datetime-date');
  const dtTimeEls = document.querySelectorAll('.datetime-time');
  function pad(n) { return n < 10 ? '0' + n : n; }
  function updateClock() {
    const now = new Date();
    const dayText = dayNames[now.getDay()];
    const dateText = `${pad(now.getDate())}. ${monthNames[now.getMonth()]}, ${now.getFullYear()}.`;
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    if (hours === 0) hours = 12;
    const timeText = `${pad(hours)}:${pad(now.getMinutes())} ${ampm}`;
    dtDayEls.forEach(el => el.innerText = dayText);
    dtDateEls.forEach(el => el.innerText = dateText);
    dtTimeEls.forEach(el => el.innerText = timeText);
  }
  updateClock();
  setInterval(updateClock, 1000);
})();

loadTrack(0);
fetchDiscordData();
initViewsCounter();
</script>
